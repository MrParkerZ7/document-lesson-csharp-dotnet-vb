# MotorQuote delivery pipeline. Read into lesson 12 — NOT active: GitHub only runs workflows
# stored under .github/workflows/. Action versions checked in September 2026.
name: deploy

on:
  push:
    branches: [main]

#region oidc
permissions:
  id-token: write # GitHub mints an OIDC token; AWS STS trades it for a role session
  contents: read
#endregion

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SAMPLES: lesson-12-cloud-native-modernization/samples
      TF_VAR_lambda_role_arn: ${{ vars.LAMBDA_ROLE_ARN }}
      TF_VAR_task_execution_role_arn: ${{ vars.TASK_EXECUTION_ROLE_ARN }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
    steps:
      #region build
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet test $SAMPLES/L12.QuoteLambda.Tests -c Release

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }} # no access keys stored anywhere
          aws-region: ap-southeast-1

      - name: Package the Lambda (framework-dependent IL runs on arm64 unchanged)
        run: |
          dotnet publish $SAMPLES/L12.QuoteLambda -c Release -o out/lambda
          (cd out/lambda && zip -qr ../quote-lambda.zip .)
      #endregion

      #region ship
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push a multi-arch image (no Dockerfile, no Docker daemon)
        run: >
          dotnet publish $SAMPLES/L12.QuoteContainer -c Release -t:PublishContainer
          -p ContainerRegistry=${{ steps.ecr.outputs.registry }}
          -p ContainerImageTags=${{ github.sha }}

      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=$SAMPLES/infra init -input=false
      - run: >
          terraform -chdir=$SAMPLES/infra apply -input=false -auto-approve
          -var lambda_zip=${{ github.workspace }}/out/quote-lambda.zip
          -var image=${{ steps.ecr.outputs.registry }}/motorquote/quote-api:${{ github.sha }}
      #endregion
